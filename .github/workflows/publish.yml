# Publishes the package to npm through npm Trusted Publishing: GitHub proves the build came
# from this repository, so no npm token or one-time password is stored anywhere.
# Run it from the Actions tab ("Run workflow"), or by publishing a GitHub Release.
name: Publish to npm

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify the publish came from this workflow

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs a newer npm than the one bundled with Node 22.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
